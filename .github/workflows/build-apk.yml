name: Build APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StokBakeri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StokBakeri-apk
          path: StokBakeri.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StokBakeri.apk \
            --target "${{ github.sha }}" \
            --title "Stok Bakeri (latest build)" \
            --notes "Built from ${{ github.ref_name }} at ${{ github.sha }}. Download StokBakeri.apk below and open it on your Android phone."
