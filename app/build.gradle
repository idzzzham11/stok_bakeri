plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stokbakeri.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stokbakeri.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Committed debug-style key so every build has the same signature and
        // installs as an update over the previous one. Not for Play Store use.
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
